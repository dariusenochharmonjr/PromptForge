{% extends 'workflows/base.html' %}

{% block title %}Delete Workflow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body text-center">
                <h2 class="card-title text-danger">Are you sure?</h2>
                <p class="card-text">
                    You are about to delete <strong>"{{ workflow.title }}"</strong>. 
                    This action cannot be undone.
                </p>
                
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete It</button>
                    <a href="{% url 'detail' workflow.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
